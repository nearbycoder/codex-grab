name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dry-run package tarballs
        run: |
          npm pack --dry-run -w @codex-grab/core
          npm pack --dry-run -w @codex-grab/react
          npm pack --dry-run -w @codex-grab/bridge
